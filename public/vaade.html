<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teie objekt · Uus Maa</title>
<style>
  :root{--bg:#0d1310;--sf:#151f19;--cd:#1b2721;--cd2:#233129;--ink:#e9efe9;--ink2:#93a89b;--ink3:#5f7166;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.12);--gr:#48c281;--gr2:#2b8f5a;--grsoft:rgba(72,194,129,.15);--te:#dd8d61;--sh:0 20px 44px -30px rgba(0,0,0,.85)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:var(--ink);font-size:14px;line-height:1.55;background:radial-gradient(1100px 600px at 86% -10%,rgba(72,194,129,.10),transparent 60%),var(--bg);min-height:100vh}
  .serif{font-family:"Georgia","Times New Roman",serif}
  .wrap{max-width:720px;margin:0 auto;padding:26px 20px 60px}
  .top{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--gr),var(--gr2));color:#06140d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .brand{font-weight:700;font-size:15px}.brand span{color:var(--ink3);font-weight:500;font-size:12px}
  .hero{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:14px;box-shadow:var(--sh)}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:3px}
  .sub{color:var(--ink2);font-size:13px;margin-bottom:18px}
  .price{font-size:30px;font-weight:700;color:var(--gr);margin-bottom:2px}
  .card{background:linear-gradient(180deg,var(--cd),var(--sf));border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
  .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:10px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
  .fact .v{font-size:17px;font-weight:600}.fact .k{font-size:11px;color:var(--ink2)}
  .mkt{font-size:14px}.mkt b{color:var(--gr)}
  .gal{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.gal img{width:96px;height:72px;object-fit:cover;border-radius:8px}
  .listing{white-space:pre-wrap;font-size:13.5px;color:var(--ink);line-height:1.65}
  .agent{display:flex;align-items:center;gap:12px}.agent .a{width:44px;height:44px;border-radius:50%;background:var(--grsoft);color:var(--gr);display:flex;align-items:center;justify-content:center;font-weight:700}
  .agent a{color:var(--gr);text-decoration:none}
  .foot{text-align:center;color:var(--ink3);font-size:11px;padding-top:16px}
  .msg{text-align:center;color:var(--ink2);padding:60px 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="mark">UM</span><span class="brand">Uus Maa <span>· teie objekti ülevaade</span></span></div>
  <div id="app"><div class="msg">Laen…</div></div>
  <div class="foot">See on aus ülevaade teie objektist — turupositsioon päris Maa-ameti andmetel. Küsimuste korral võtke ühendust.</div>
</div>
<script>
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function eur(n){return Number(n).toLocaleString('et-EE');}
  function photoList(o){var raw=(o&&o.photos)||'';var arr=String(raw).split(/[\n,]+/).map(function(s){return s.trim();}).filter(function(s){return /^https?:\/\//i.test(s);});if(!arr.length&&o&&o.img_url)arr=[o.img_url];return arr;}
  async function load(){
    var token=new URLSearchParams(location.search).get('token');var app=document.getElementById('app');
    if(!token){app.innerHTML='<div class="msg">Vigane link.</div>';return;}
    try{var r=await fetch('/api/share?token='+encodeURIComponent(token));var j=await r.json();
      if(!j||!j.ok){app.innerHTML='<div class="msg">'+esc((j&&j.error)||'Linki ei leitud.')+'</div>';return;}
      var o=j.object,ph=photoList(o),loc=[o.asum,o.district,o.county].filter(Boolean).join(', ');
      var h='';
      if(ph[0])h+='<img class="hero" src="'+esc(ph[0])+'" onerror="this.style.display=\'none\'">';
      h+='<h1 class="serif">'+esc((o.property_type||'Objekt')+(loc?(' — '+loc):''))+'</h1><div class="sub">'+esc(o.property_address||'')+'</div>';
      if(o.price!=null)h+='<div class="card"><div class="price">'+eur(o.price)+' €</div>'+((o.price&&o.area)?('<div style="color:var(--ink2);font-size:13px">'+eur(Math.round(o.price/o.area))+' €/m²</div>'):'')+'</div>';
      var facts=[];function f(k,v){if(v!=null&&v!=='')facts.push('<div class="fact"><div class="v">'+esc(v)+'</div><div class="k">'+k+'</div></div>');}
      f('üldpind',o.area!=null?o.area+' m²':'');f('kinnistu',o.plot_area!=null?o.plot_area+' m²':'');f('tube',o.rooms);f('korrus',o.floor);f('ehitusaasta',o.build_year);f('seisukord',o.condition);f('energiaklass',o.energy_label);
      if(facts.length)h+='<div class="card"><div class="lbl">Objekt</div><div class="facts">'+facts.join('')+'</div></div>';
      if(j.market&&o.price&&o.area){var om2=Math.round(o.price/o.area),diff=Math.round((om2/j.market.median-1)*100);h+='<div class="card"><div class="lbl">Turupositsioon · Maa-amet</div><div class="mkt">Piirkonna mediaan <b>'+eur(j.market.median)+' €/m²</b> ('+j.market.tx+' tehingut). Teie objekt <b>'+eur(om2)+' €/m²</b> — '+(diff>0?('<b>'+diff+'% üle</b>'):diff<0?('<b>'+Math.abs(diff)+'% alla</b>'):'samal tasemel')+' turu.</div><div style="font-size:10px;color:var(--ink3);margin-top:6px">Piirkonna keskmine, ei arvesta seisukorda/korrust.</div></div>';}
      if(ph.length>1)h+='<div class="card"><div class="lbl">Pildid</div><div class="gal">'+ph.slice(1,9).map(function(u){return '<img src="'+esc(u)+'" onerror="this.style.display=\'none\'">';}).join('')+'</div></div>';
      if(o.listing_text)h+='<div class="card"><div class="lbl">Kirjeldus</div><div class="listing">'+esc(o.listing_text)+'</div></div>';
      var ag=j.agent||{};h+='<div class="card"><div class="lbl">Teie maakler</div><div class="agent"><div class="a">MK</div><div><div style="font-weight:600">'+esc(ag.name)+'</div><div style="font-size:12px;color:var(--ink2)">'+esc(ag.org)+'</div><div style="font-size:13px;margin-top:3px"><a href="tel:'+esc(ag.phone)+'">'+esc(ag.phone)+'</a> · <a href="mailto:'+esc(ag.email)+'">'+esc(ag.email)+'</a></div></div></div></div>';
      app.innerHTML=h;
    }catch(e){app.innerHTML='<div class="msg">Viga laadimisel.</div>';}
  }
  load();
</script>
</body>
</html>
